<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<title>Tables and lists</title>
<style>
@page { size: 4in 4in; margin: 0.5in; }
@page :blank { }
body { margin: 0; font: 14px/20px "Test Mono"; }
table { border-collapse: collapse; }
td, th { border: 1px solid black; padding: 0; height: 38px; }
ol { margin: 0; }
li { height: 40px; }
.page { break-before: page; }
</style>
</head>
<body>
<table>
<thead><tr><th>Head</th></tr></thead>
<tbody>
<tr><td>R1</td></tr><tr><td>R2</td></tr><tr><td>R3</td></tr><tr><td>R4</td></tr>
<tr><td>R5</td></tr><tr><td>R6</td></tr><tr><td>R7</td></tr><tr><td>R8</td></tr>
</tbody>
</table>
<ol class="page" start="3">
<li>Item 3</li><li>Item 4</li><li>Item 5</li><li>Item 6</li><li>Item 7</li><li>Item 8</li><li>Item 9</li><li>Item 10</li>
</ol>
</body>
</html>
