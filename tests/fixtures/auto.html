<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<title>Auto</title>
<style>
@page { size: 4in 4in; margin: 0.5in; @top-center { content: string(t); } }
h1 { string-set: t content(text); }
.page { break-before: page; }
</style>
<script>
window.rendered = 0;
document.addEventListener("pagedmedia:rendered", event => { window.rendered = event.detail.pages.length; });
</script>
<script src="../../dist/paged-media.js"></script>
</head>
<body><h1>One</h1><p class="page">Two</p></body>
</html>
