name: Bug Report
description: Report incorrect pagination, layout, or output from the polyfill.
title: "bug: "
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to file a bug report.

              Before filing, please check [docs/support.md](https://github.com/humanwhocodes/paged-media/blob/main/docs/support.md)
              to confirm the feature is one the polyfill implements. Features listed as
              not supported there (such as `bookmark-level`) are known gaps, not bugs.

              **A link to a repository with a minimal reproduction case is required.**
              Issues without one cannot be triaged and will be closed.

    - type: input
      id: reproduction
      attributes:
          label: Reproduction repository
          description: |
              A link to a public repository or gist containing the smallest HTML + CSS
              document that shows the problem, plus the command used to run it
              (for example `node scripts/render-pdf.js input.html output.pdf`).
              Please strip out everything unrelated to the bug.
          placeholder: https://github.com/your-name/paged-media-bug-1234
      validations:
          required: true

    - type: checkboxes
      id: reproduction-confirmation
      attributes:
          label: Reproduction checklist
          options:
              - label: The link above is public and I have verified it reproduces the problem.
                required: true
              - label: The reproduction is minimal - unrelated content, styles, and dependencies have been removed.
                required: true

    - type: dropdown
      id: feature
      attributes:
          label: CSS Paged Media feature
          description: Which paged media feature is involved? Pick the closest match.
          options:
              - "@page size / margin / page-orientation"
              - "@page selectors (:first, :left, :right, :blank, :nth())"
              - Named pages (page, @page name)
              - Page-margin boxes (@top-center, @bottom-left-corner, ...)
              - Page counters (counter(page), counter(pages))
              - "Printer's marks and bleed (marks, bleed)"
              - Fragmentation (break-before, break-after, break-inside, orphans, widows)
              - Named strings (string-set, string())
              - "Running elements (position: running(), element())"
              - "Footnotes (float: footnote, @footnote, ::footnote-call, ::footnote-marker)"
              - Cross references (target-counter(), target-counters(), target-text())
              - Leaders (leader())
              - CSS counters (counter-reset, counter-increment, counters())
              - Generated content (content, ::before, ::after, content())
              - Bookmarks (bookmark-level, bookmark-label, bookmark-state)
              - CSS parsing / stylesheet loading
              - Build, types, or packaging
              - Other / not sure
      validations:
          required: true

    - type: input
      id: spec-reference
      attributes:
          label: Specification reference
          description: |
              A link to the relevant section of [CSS Paged Media](https://www.w3.org/TR/css-page-3/)
              or [CSS Generated Content for Paged Media](https://www.w3.org/TR/css-gcpm-3/),
              or the exact property, descriptor, or function name if you chose
              "Other / not sure" above.
          placeholder: https://www.w3.org/TR/css-gcpm-3/#footnotes
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: What did you expect to happen?
          description: Describe the output the specification calls for.
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: What actually happened?
          description: |
              Describe the output you got. Screenshots of the rendered pages or of the
              generated PDF are very helpful. Include any `warnings` from the
              `polyfill()` result and any console errors.
      validations:
          required: true

    - type: textarea
      id: environment
      attributes:
          label: Environment
          description: Fill in the versions you are using.
          value: |
              - `@humanwhocodes/paged-media` version:
              - How it is loaded (browser bundle / module / `scripts/render-pdf.js`):
              - Browser and version (or Puppeteer and bundled Chrome version):
              - Node.js version:
              - Operating system:
      validations:
          required: true

    - type: textarea
      id: additional
      attributes:
          label: Additional context
          description: Anything else that might help, such as workarounds you have tried.
      validations:
          required: false
